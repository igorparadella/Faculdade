name: Auto Push

on:
  schedule:
    - cron: '*/5 * * * *'  # Isso vai rodar a cada 5 minutos
  workflow_dispatch:  # Permite rodar manualmente a qualquer momento

jobs:
  push_changes:
    runs-on: ubuntu-latest  # Aqui você pode mudar manualmente para windows-latest ou macos-latest, se precisar.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Set up Git configuration
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "${{ secrets.COMMIT_MESSAGE }}"
          git push origin "${{ secrets.BRANCH_NAME }}"
